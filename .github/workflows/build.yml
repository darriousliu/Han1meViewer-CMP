# 四端 Release 产物的唯一一份构建实现：push（ci.yml）、PR（pr_check.yml）、
# 打标签或手动（release.yml）都调这里，构建逻辑只维护这一份。
#
# 三个入口全部构建 Release 而不是 Debug：Release 才会跑 R8、abi split、Kotlin/Native 的 LTO、
# jpackage，这些环节出问题只有 Release 构建能提前暴露；顺带每个 commit 都留下能直接装机的产物。
#
# 每个平台一个独立 job，互不阻塞，挂一个不影响其它三个出包。不产出 Linux 包。
name: Build Artifacts

on:
  workflow_call:
    inputs:
      platforms:
        description: "要构建的平台：all，或逗号分隔的 android,ios,windows,macos"
        type: string
        default: "all"
        required: false

permissions:
  contents: read

env:
  # 四端 CI 都构建发行版；Xcode 回调的 Gradle 进程也会继承此项目属性。
  ORG_GRADLE_PROJECT_hanimeRelease: "true"
  # 四个 job 统一 25，与 gradle/gradle-daemon-jvm.properties 里的 toolchainVersion 对齐。
  # 桌面端必须是 25：Nucleus 的 AOT cache 是 JDK 25 的能力，而 jlink 出运行时、跑 AOT
  # 训练轮用的都是守护进程这份 JDK。Android（AGP 9 + R8）与 iOS 在 25 上实测无问题，
  # 各自的 jvmTarget 仍是 21，产物字节码不受影响。
  JAVA_VERSION: "25"
  # ⚠️ 发行版不能用 temurin：**Adoptium 从 JDK 25 起不再随包发 `jmods/`**（mac/aarch64 与
  # win/x64 均已核实为 0 个），而 jlink 造运行时镜像必须要它，桌面两个 job 会挂在打包步，
  # 报「此 JDK 不包含打包模块」。JDK 21 时代 temurin 还带 jmods，所以以前没暴露。
  # 选 corretto：它只有一个变体、且不含 JavaFX（jmods 69/70 个，与 Oracle OpenJDK 一致）。
  # zulu 也带 jmods，但分 ca 与 ca-fx 两种，取到 ca-fx 会连 JavaFX 一起 jlink 进去
  # ——本工程 includeAllModules = true，实测安装包会平白大 38 MB。
  JAVA_DISTRIBUTION: "corretto"
  # 覆盖仓库里的 -Xmx2048m。Kotlin/Native、R8、jpackage 在 Runner 上都很容易撑爆 2G，
  # 写进 GRADLE_USER_HOME 才盖得住工程根目录那份（Gradle 里前者优先级更高）。
  GRADLE_JVMARGS: "-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8"

jobs:
  android:
    name: Android（arm64-v8a APK）
    if: inputs.platforms == 'all' || contains(inputs.platforms, 'android')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: 检出代码
        uses: actions/checkout@v6

      - name: 换回官方 Gradle 发行源
        # 仓库 wrapper 指向腾讯云镜像，GitHub Runner 拉它又慢又常超时
        run: |
          sed -i 's|mirrors.cloud.tencent.com/gradle/|services.gradle.org/distributions/|' gradle/wrapper/gradle-wrapper.properties
          chmod +x gradlew

      - name: 配置 JDK
        uses: actions/setup-java@v5
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}

      - name: 配置 Android SDK
        uses: android-actions/setup-android@v3

      - name: 配置 Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: 抬高 Gradle 守护进程内存
        run: |
          mkdir -p ~/.gradle
          echo "org.gradle.jvmargs=${GRADLE_JVMARGS}" >> ~/.gradle/gradle.properties

      - name: 检查发行模式与更新通知
        run: |
          ./gradlew :buildSrc:test :shared:jvmTest --stacktrace
          python3 -B -m unittest discover -s .github/scripts -p 'test_*.py'

      - name: 构建 Release APK
        # CI 已显式启用发行模式；仍明确选择 Android Release 变体。
        # abi split 只出 arm64-v8a（见 :app 的 splits 配置），所以只有一个 apk。
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: 签名 APK
        # :app 里没有 signingConfig，assembleRelease 出来的是未签名包，这里用 build-tools 补签。
        # 普通构建没有 keystore secrets（例如 fork PR）时允许上传未签名产物；
        # v* 标签的发布构建必须有完整的四项 secrets，证书也必须匹配原生校验。
        #
        # ⚠️ 必须用与 app/src/main/cpp/chino.h 里 EXPECTED_SIG_HASH 对应的那把发布密钥：
        # Release 版进视频页会做原生签名校验，换把钥匙签出来的包能装但进不去视频页。
        # 签名配置见《正式版构建行动指南.md》第 4 节。
        env:
          KEYSTORE_BASE_64: ${{ secrets.KEYSTORE_BASE_64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEYSTORE_ALIAS: ${{ secrets.RELEASE_KEYSTORE_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$KEYSTORE_BASE_64" ]; then
            if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
              echo "::error::发布构建缺少 KEYSTORE_BASE_64，拒绝生成未签名的正式 APK"
              exit 1
            fi
            echo "::warning title=APK 未签名::没有配置 KEYSTORE_BASE_64，本次产物是未签名 APK，无法直接安装"
            exit 0
          fi
          for secret_name in RELEASE_KEYSTORE_PASSWORD RELEASE_KEYSTORE_ALIAS RELEASE_KEY_PASSWORD; do
            if [ -z "${!secret_name}" ]; then
              echo "::error::缺少 Android 签名 Secret: $secret_name"
              exit 1
            fi
          done
          umask 077
          trap 'rm -f "$RUNNER_TEMP/release.jks"' EXIT
          printf '%s' "$KEYSTORE_BASE_64" | base64 -d > "$RUNNER_TEMP/release.jks"
          EXPECTED_HASH="$(sed -n 's/^#define EXPECTED_SIG_HASH "\([0-9a-f]*\)"/\1/p' app/src/main/cpp/chino.h)"
          if [[ ! "$EXPECTED_HASH" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::chino.h 中的 EXPECTED_SIG_HASH 必须是 64 位小写十六进制"
            exit 1
          fi
          BUILD_TOOLS="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)"
          for apk in app/build/outputs/apk/release/*.apk; do
            # 未签名包 AGP 不会对齐，必须先 zipalign 再 apksigner
            "$BUILD_TOOLS/zipalign" -P 16 -f 4 "$apk" "$apk.aligned"
            "$BUILD_TOOLS/apksigner" sign \
              --ks "$RUNNER_TEMP/release.jks" \
              --ks-pass "env:RELEASE_KEYSTORE_PASSWORD" \
              --ks-key-alias "$RELEASE_KEYSTORE_ALIAS" \
              --key-pass "env:RELEASE_KEY_PASSWORD" \
              --v2-signing-enabled true \
              --out "$apk" "$apk.aligned"
            rm -f "$apk.aligned" "$apk.idsig"
            VERIFY_OUTPUT="$("$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$apk")"
            printf '%s\n' "$VERIFY_OUTPUT"
            # 默认验证会优先检查 v3；这里额外检查原生代码读取的 v2 签名块，
            # 只改变签名验证范围，不改变应用的 minSdk 或支持平台。
            V2_VERIFY_OUTPUT="$("$BUILD_TOOLS/apksigner" verify --min-sdk-version 24 --max-sdk-version 27 --verbose --print-certs "$apk")"
            printf '%s\n' "$V2_VERIFY_OUTPUT"
            if [[ "$V2_VERIFY_OUTPUT" != *"Verified using v2 scheme (APK Signature Scheme v2): true"* ]]; then
              echo "::error::APK 缺少原生校验所需的有效 v2 签名"
              exit 1
            fi
            # 兼容旧版 Signer #1 与新版 V2/V3.0 Signer 的输出前缀；所有证书必须一致。
            ACTUAL_HASH="$(printf '%s\n%s\n' "$VERIFY_OUTPUT" "$V2_VERIFY_OUTPUT" | awk '/certificate SHA-256 digest:/ {print $NF}' | sort -u)"
            if [ "$ACTUAL_HASH" != "$EXPECTED_HASH" ]; then
              echo "::error::APK 签名证书与 EXPECTED_SIG_HASH 不一致，拒绝上传"
              exit 1
            fi
            "$BUILD_TOOLS/zipalign" -c -P 16 4 "$apk"
          done

      - name: 上传 APK
        uses: actions/upload-artifact@v7
        with:
          name: android-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: 上传 R8 mapping
        # 线上崩溃栈要靠它还原，跟着这次构建一起存。
        # 这份 mapping 有一百多兆，每次 push 都留 90 天太占地方，缩到 30 天
        uses: actions/upload-artifact@v7
        with:
          name: android-mapping
          path: app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: warn
          retention-days: 30

  ios:
    name: iOS（临时自签名 IPA）
    if: inputs.platforms == 'all' || contains(inputs.platforms, 'ios')
    # 用 Intel Runner（14 GB 内存），不是 arm64 那台（只有 7 GB）：
    # :shared:linkReleaseFrameworkIosArm64 的 LTO 阶段实测 4 GB 堆必 OOM
    # （CallGraphBuilder 里 OutOfMemoryError），5 GB 能过但进程 RSS 峰值到 10 GB，
    # 7 GB 的机器装不下。Kotlin/Native 从 x86_64 host 交叉编译 iosArm64、
    # Xcode 交叉归档 arm64 App 都没问题。
    runs-on: macos-latest
    timeout-minutes: 90
    env:
      # 盖掉上面的 4g。也别再往上加：Kotlin/Native 的 LLVM 后端在同一个进程里用堆外内存，
      # 堆给到 8 GB 会把 Runner 的 14 GB 顶穿。
      GRADLE_JVMARGS: "-Xmx6g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8"
    steps:
      - name: 检出代码
        uses: actions/checkout@v6

      - name: 换回官方 Gradle 发行源
        run: |
          sed -i '' 's|mirrors.cloud.tencent.com/gradle/|services.gradle.org/distributions/|' gradle/wrapper/gradle-wrapper.properties
          chmod +x gradlew

      - name: 配置 JDK
        uses: actions/setup-java@v5
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}

      - name: 配置 Android SDK
        # iOS 也要：:app / :shared 是 AGP 工程，Xcode 回调的那次 Gradle 依然要配置整个 build
        uses: android-actions/setup-android@v3

      - name: 配置 Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: 缓存 Kotlin/Native 工具链
        uses: actions/cache@v5
        with:
          path: ~/.konan
          # 带上 arch：iOS 跑在 Intel Runner 上，与 arm64 Runner 不是同一套工具链
          key: konan-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: konan-${{ runner.os }}-${{ runner.arch }}-

      - name: 抬高 Gradle 守护进程内存
        run: |
          mkdir -p ~/.gradle
          echo "org.gradle.jvmargs=${GRADLE_JVMARGS}" >> ~/.gradle/gradle.properties

      - name: 编译公共代码的 metadata
        # 中间源集（androidJvmMain / jvmIosMain）只在 metadata 编译里按 common 视图解析，
        # 叶子 target 编得过不代表这里过得去，必须单独跑一遍。
        # 放在归档前面：几分钟就能跑完，比等 Kotlin/Native 链接完再报错省事。
        run: |
          ./gradlew --stacktrace \
            :shared:compileKotlinMetadata \
            :shared:compileJvmIosMainKotlinMetadata \
            :shared:compileAndroidJvmMainKotlinMetadata

      - name: 同步版本号进 iOS 壳
        # Config.xcconfig 是 xcodebuild 启动时就读走的，必须赶在归档之前写好；
        # 版号的唯一来源是 buildSrc 里的 Config.App
        run: ./gradlew syncIosVersion

      - name: 归档 iOS App
        # 归档时不使用 Apple 开发者证书，显式关闭签名并清空 Team，
        # 打包时再执行 codesign --sign - 临时自签名，不需要 iOS 签名 secrets。
        # 归档会触发 Compile Kotlin Framework 阶段，即 :shared:embedAndSignAppleFrameworkForXcode，
        # Swift 侧编译不过同样会在这里失败。
        run: |
          xcodebuild archive \
            -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Han1meViewer.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM=""

      - name: 打包成 IPA
        # 没有 exportOptions.plist 能用（那条路要真证书），手工拼 Payload/。
        # codesign --sign - 生成临时 ad-hoc 自签名；用户安装时仍需用侧载工具重签。
        run: |
          APP="$RUNNER_TEMP/Han1meViewer.xcarchive/Products/Applications/Han1meViewer.app"
          if [ ! -d "$APP" ]; then
            echo "::error::归档里没找到 Han1meViewer.app，检查 PRODUCT_NAME 是否被改过"
            exit 1
          fi
          rm -rf "$RUNNER_TEMP/Payload"
          mkdir -p "$RUNNER_TEMP/Payload"
          cp -R "$APP" "$RUNNER_TEMP/Payload/"
          codesign --force --deep --sign - --timestamp=none "$RUNNER_TEMP/Payload/Han1meViewer.app"
          codesign --verify --deep --strict --verbose=2 "$RUNNER_TEMP/Payload/Han1meViewer.app"
          mkdir -p "$GITHUB_WORKSPACE/artifacts"
          cd "$RUNNER_TEMP"
          zip -qry "$GITHUB_WORKSPACE/artifacts/Han1meViewer.ipa" Payload

      - name: 上传 IPA
        uses: actions/upload-artifact@v7
        with:
          name: ios-ipa
          path: artifacts/Han1meViewer.ipa
          if-no-files-found: error

  windows:
    name: Windows（x64 NSIS 安装包与免安装包）
    if: inputs.platforms == 'all' || contains(inputs.platforms, 'windows')
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: 检出代码
        uses: actions/checkout@v6

      - name: 换回官方 Gradle 发行源
        shell: bash
        run: |
          sed -i 's|mirrors.cloud.tencent.com/gradle/|services.gradle.org/distributions/|' gradle/wrapper/gradle-wrapper.properties

      - name: 配置 JDK
        uses: actions/setup-java@v5
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}

      - name: 配置 Android SDK
        uses: android-actions/setup-android@v3

      - name: 配置 Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: 抬高 Gradle 守护进程内存
        shell: bash
        run: |
          mkdir -p ~/.gradle
          echo "org.gradle.jvmargs=${GRADLE_JVMARGS}" >> ~/.gradle/gradle.properties

      # WiX v3 那一步没了：Nucleus 不再用 jpackage 出安装包，而是 jpackage 出 app-image
      # 之后交给 electron-builder（Runner 自带 Node，插件会按锁文件自行 npm ci 拉工具链）。

      - name: 打包 Windows 发行版
        # 一条任务同时出 NSIS 安装包与免安装 Zip（targetFormats 里声明的，Windows 上
        # Dmg/Deb 会被自动跳过），原来那段 7z 手工压包也就不需要了。
        #
        # 用不带 proguard 的 packageDistributionForCurrentOS 而非 packageRelease*：
        # 后者会对桌面产物做混淆，而 mediamp 要反射读 Skiko 内部结构、Koin/Room/序列化
        # 也都吃反射，混过去就是运行时炸。体积换稳定，先这样。
        shell: bash
        run: |
          set -o pipefail
          ./gradlew :desktopApp:packageDistributionForCurrentOS --stacktrace 2>&1 | tee gradle-desktop.log

      - name: 检查 AOT 训练轮是否真的跑完
        # enableAotCache 打开后，插件会在打包途中把应用跑一遍来记录类加载与 JIT profile。
        # 那个进程崩了插件**不会让构建失败**，只是缓存退化成「只覆盖到崩溃前」，
        # 装出来的包照样能用，但冷启动提速会大打折扣。这里把它显式捞出来。
        if: always()
        shell: bash
        run: |
          if grep -q '\[aotCache\] Output (exit [^0]' gradle-desktop.log; then
            echo "::warning::AOT 训练轮非正常退出，随包的 app.aot 质量已退化（应用本身不受影响）"
            grep -n -B2 -A8 '\[aotCache\]' gradle-desktop.log | head -40
          else
            echo "AOT 训练轮正常"
          fi

      # 安装包与便携版分成两个产物上传：合在一起的话，只想拿 exe 也得下三百多兆。
      # latest.yml 与 .blockmap 跟着安装包走——前者是更新器读的版本清单，后者是差分下载的
      # 分块索引，缺一样自动更新就退化成全量下载或直接找不到新版。
      # 这里按扩展名而不是目录名筛：Windows 侧的格式目录名（nsis/）没在 CI 上验证过。
      - name: 上传 Windows 安装包
        uses: actions/upload-artifact@v7
        with:
          name: windows-installer
          path: |
            desktopApp/build/compose/binaries/main/*/*.exe
            desktopApp/build/compose/binaries/main/*/*.exe.blockmap
            desktopApp/build/compose/binaries/main/*/latest.yml
          if-no-files-found: error

      - name: 上传 Windows 便携版
        uses: actions/upload-artifact@v7
        with:
          name: windows-portable
          path: |
            desktopApp/build/compose/binaries/main/*/*.zip
            desktopApp/build/compose/binaries/main/*/*.zip.blockmap
          if-no-files-found: error

  macos:
    name: macOS（arm64 DMG 与更新用 Zip）
    if: inputs.platforms == 'all' || contains(inputs.platforms, 'macos')
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - name: 检出代码
        uses: actions/checkout@v6

      - name: 换回官方 Gradle 发行源
        run: |
          sed -i '' 's|mirrors.cloud.tencent.com/gradle/|services.gradle.org/distributions/|' gradle/wrapper/gradle-wrapper.properties
          chmod +x gradlew

      - name: 配置 JDK
        uses: actions/setup-java@v5
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}

      - name: 配置 Android SDK
        uses: android-actions/setup-android@v3

      - name: 配置 Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: 抬高 Gradle 守护进程内存
        run: |
          mkdir -p ~/.gradle
          echo "org.gradle.jvmargs=${GRADLE_JVMARGS}" >> ~/.gradle/gradle.properties

      - name: 打包 macOS 发行版
        # 同 Windows，走不混淆的 packageDistributionForCurrentOS。
        # 这一条同时出 Dmg 与 Zip：Dmg 只用于首装，自动更新是把 .app 从 Zip 里静默替换掉的，
        # 少了 Zip 就没有 macOS 的自动更新。
        # libmpv 原生库按构建机 OS+架构选（见 :desktopApp 的 osTriple），
        # Runner 是 Apple 芯片，所以这份产物只能给 arm64 Mac 用。
        run: |
          set -o pipefail
          ./gradlew :desktopApp:packageDistributionForCurrentOS --stacktrace 2>&1 | tee gradle-desktop.log

      - name: 检查 AOT 训练轮是否真的跑完
        if: always()
        run: |
          if grep -q '\[aotCache\] Output (exit [^0]' gradle-desktop.log; then
            echo "::warning::AOT 训练轮非正常退出，随包的 app.aot 质量已退化（应用本身不受影响）"
            grep -n -B2 -A8 '\[aotCache\]' gradle-desktop.log | head -40
          else
            echo "AOT 训练轮正常"
          fi

      # 同 Windows，安装包与便携版分开传（实测 dmg 167 MB + zip 174 MB，合起来 341 MB）。
      # dmg/ 与 zip/ 会各生成一份 latest-mac.yml，各自只列自己那个文件，所以让它们跟着
      # 各自的产物走，由 release.yml 合并成一份同时列出两者的清单。
      #
      # ⚠️ macOS 的 zip 不只是便携版，它还是**自动更新的下载源**（更新器从 zip 里静默替换
      # .app，dmg 只用于首装），所以这个产物不能省，release 里也必须带上。
      - name: 上传 macOS 安装包
        uses: actions/upload-artifact@v7
        with:
          name: macos-installer
          path: |
            desktopApp/build/compose/binaries/main/dmg/*.dmg
            desktopApp/build/compose/binaries/main/dmg/*.blockmap
            desktopApp/build/compose/binaries/main/dmg/latest-mac.yml
          if-no-files-found: error

      - name: 上传 macOS 便携版
        uses: actions/upload-artifact@v7
        with:
          name: macos-portable
          path: |
            desktopApp/build/compose/binaries/main/zip/*.zip
            desktopApp/build/compose/binaries/main/zip/*.blockmap
            desktopApp/build/compose/binaries/main/zip/latest-mac.yml
          if-no-files-found: error
